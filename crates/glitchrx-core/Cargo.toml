[package]
name = "glitchrx-core"
description = "Core engine for glitcharaxia: raw-pixel databending with Audacity-style effects, recipes, image decoding and encoding."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["fs"]
# libjpeg-turbo (TurboJPEG 3 API) is always used and found through pkg-config.
# This builds it from bundled source instead (needs cmake; nasm for SIMD),
# for macOS/Windows builds where no system library is present.
vendored = ["turbojpeg-sys/cmake"]
# Filesystem helpers: output naming rules and safe (no-clobber) writes.
fs = ["dep:tempfile", "dep:same-file"]

[dependencies]
turbojpeg-sys.workspace = true
rand_chacha.workspace = true
rand_core.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
png.workspace = true
tiff.workspace = true
libwebp-sys.workspace = true
ravif.workspace = true
rgb.workspace = true
avif-serialize.workspace = true
zip.workspace = true
flate2.workspace = true
crc32fast.workspace = true
tempfile = { workspace = true, optional = true }
same-file = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
insta.workspace = true
blake3.workspace = true
tempfile.workspace = true
