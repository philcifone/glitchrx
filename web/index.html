<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>glitchrx</title>
    <meta name="description" content="Databend photos the way Audacity would." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Installable app: the manifest (Android, desktop) and the iOS
         equivalents, which Safari reads from meta tags instead. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="glitchrx" />
    <!-- "default" keeps the status bar legible on both themes; iOS reads it
         once at launch, so it cannot follow the theme toggle. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Bar colours per theme; lib/theme.ts overrides both when the
         toggle forces one. -->
    <meta name="theme-color" content="#fbf7ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#282828" media="(prefers-color-scheme: dark)" />

    <!-- Launch splash: painted with the first bytes of HTML, before the
         script loads, and faded out by main.ts once the app is mounted. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #f4efe0;
        transition: opacity 0.25s ease-out;
      }
      #splash img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
      }
      #splash.gone {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-color-scheme: dark) {
        #splash {
          background: #1d2021;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><img src="/icon.svg" alt="" /></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
