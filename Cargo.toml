[workspace]
resolver = "3"
members = ["crates/glitchrx-core", "crates/glitchrx-cli", "crates/glitchrx-serve", "crates/glitchrx-desktop", "tools/gen-fixtures", "tools/contact-sheet"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"
publish = false

[workspace.dependencies]
glitchrx-core = { path = "crates/glitchrx-core" }
glitchrx-serve = { path = "crates/glitchrx-serve" }
turbojpeg-sys = { version = "1.2", default-features = false, features = ["pkg-config"] }
rand_chacha = "0.9"
rand_core = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
anyhow = "1"
png = "0.18"
tiff = "0.11"
# WebP: libwebp built from its bundled source (pinned, so output is the same everywhere).
libwebp-sys = "0.14"
# AVIF: rav1e, pure Rust. Without the asm feature, so no nasm is needed to build.
ravif = { version = "0.13", default-features = false, features = ["threading"] }
rgb = "0.8"
# The AVIF container, to rewrap ravif's output with Display P3 color.
avif-serialize = "0.8"
# Project files (.glrx) are zips; deflate only, through flate2's pure-Rust
# backend. 8.x is the newest line that builds on our rust-version.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
tempfile = "3"
same-file = "1"
clap = { version = "4", features = ["derive"] }
blake3 = "1"
proptest = "1"
insta = { version = "1", features = ["yaml"] }
# Web GUI (glitchrx serve)
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
serde_json = "1"
if-addrs = "0.15"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.dev.package."*"]
# Dependencies optimized even in debug builds; keeps tests on large buffers fast.
opt-level = 2
